name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14@sha256:0472f5295d05c211cc42b3daa5e84a128e390c5267b60ced9fe044bcf4edfdb8
        env:
          POSTGRES_USER: dashboards
          POSTGRES_DB: dashboards_test
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependent libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 15
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Install Syft
        working-directory: ${{ runner.temp }}
        env:
          TOOL_VERSION: 1.55.0
          TOOL_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          curl -fsSL --output syft.tar.gz "https://github.com/anchore/syft/releases/download/v${TOOL_VERSION}/syft_${TOOL_VERSION}_linux_amd64.tar.gz"
          echo "${TOOL_SHA256}  syft.tar.gz" | sha256sum --check
          sudo tar -xz -f syft.tar.gz -C /usr/local/bin syft
          syft --version

      - name: Run tests
        env:
          RAILS_ENV: test
          POSTGRES_DB: dashboards_test
          POSTGRES_USER: dashboards
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: bundle exec rake db:create db:migrate test

      - name: Generate SBOM with Syft
        run: syft . -o spdx-json=sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
